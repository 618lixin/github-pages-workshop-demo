<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小满的个人主页</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f7f4; color: #17392e; }
    main { max-width: 56rem; padding: clamp(1.25rem, 5vw, 3rem); margin: auto; }
    header { border-radius: 1.5rem; background: #17392e; color: #fff; padding: clamp(1.5rem, 6vw, 3.5rem); }
    header p { margin: 0; }
    .label { color: #c6e6d4; font-size: .95rem; }
    h1 { margin: .5rem 0 .75rem; font-size: clamp(2.3rem, 7vw, 4.2rem); line-height: 1.15; }
    p { font-size: 1.08rem; line-height: 1.65; }
    h2 { margin: 2rem 0 1rem; font-size: 1.5rem; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; }
    article { background: #fff; border: 1px solid #d7e5db; border-radius: 1rem; padding: 1.2rem; }
    h3 { margin: 0; font-size: 1.15rem; }
    article p { margin: .45rem 0 0; color: #3a534a; }
    footer { margin-top: 1.5rem; color: #465d54; font-size: .9rem; }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">我的个人主页</p>
      <h1>你好，我是小满</h1>
      <p>我喜欢用照片、纸笔和音乐记录日常。</p>
    </header>
    <section aria-labelledby="interests">
      <h2 id="interests">我喜欢做的事</h2>
      <div class="cards">
        <article><h3>骑行</h3><p>周末沿着河边慢慢骑，找一条没走过的小路。</p></article>
        <article><h3>拍照</h3><p>收集傍晚的天空，也拍路边的小树和猫。</p></article>
        <article><h3>做手账</h3><p>给每周留一页，贴票根，写下想记住的片段。</p></article>
      </div>
    </section>
    <footer>个人主页课堂示例</footer>
  </main>
</body>
</html>
